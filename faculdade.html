<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ane Madjarian | Student ID</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="id-page">

    <!-- VOLTAR -->
    <a href="index.html" class="id-back">
        ← BACK
    </a>


    <!-- DECORAÇÕES -->

    <div class="id-decoration id-star">
        ✦
    </div>

    <div class="id-decoration id-text">
        STUDENT<br>
        IDENTITY
    </div>


    <main class="id-main">

        <p class="id-page-label">
            PUC MINAS / STUDENT ID / 2026
        </p>


        <!-- ================= CARTEIRINHA ================= -->

        <div class="big-student-card">

            <!-- PARTE SUPERIOR -->

            <div class="big-card-header">

                <div class="university-name">
                    PUC MINAS
                </div>

                <div class="card-year">
                    2026
                </div>

            </div>


            <!-- PARTE PRINCIPAL -->

            <div class="big-card-body">

                <!-- FOTO -->

                <div class="big-card-photo">

                    <img
                        src="assets/foto.png"
                        alt="Foto de Ane Madjarian"
                    >

                </div>


                <!-- INFORMAÇÕES -->

                <div class="big-card-info">

                    <span class="card-label">
                        STUDENT
                    </span>

                    <h1>
                        ANE<br>
                        MADJARIAN
                    </h1>

                    <div class="card-course">

                        <span>
                            COURSE
                        </span>

                        <strong>
                            CIÊNCIA DA<br>
                            COMPUTAÇÃO
                        </strong>

                    </div>

                </div>

            </div>


            <!-- PARTE INFERIOR -->

            <div class="big-card-bottom">

                <div>
                    <span>STATUS</span>
                    <strong>ACTIVE STUDENT</strong>
                </div>

                <div>
                    <span>UNIVERSITY</span>
                    <strong>PUC MINAS</strong>
                </div>

                <div class="card-symbol">
                    ✦
                </div>

            </div>


            <!-- DETALHES DECORATIVOS -->

            <div class="card-sticker">
                STUDENT<br>
                ✦
            </div>

            <div class="card-number">
                001 / CS
            </div>

        </div>


        <!-- TEXTO FORA DA CARTEIRINHA -->

        <div class="id-caption">

            <span>
                THIS CARD BELONGS TO
            </span>

            <strong>
                ANE MADJARIAN
            </strong>

        </div>

    </main>

</body>

</html>
